[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-test"
version = "0.1.0"
description = "Google Drive 시트의 광고 정의로 Meta 광고 A/B 테스트를 생성합니다."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ab-test = "ab_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
